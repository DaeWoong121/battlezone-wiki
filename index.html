<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>BattleZone 능력 도감</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: 심층암 톤의 도감. 위에 검색·등급 필터 바(고정), 아래 능력 카드 2열 격자. 등급은 마크 채팅 색 코드로 구분 */
:root {
  --bg: #e9ece9;
  --surface: #f7f8f6;
  --sunk: #dfe3df;
  --fg: #1b201e;
  --muted: #59625d;
  --line: #cdd3ce;
  --accent: #3f6f7d;
  --key-bg: #2a3030;
  --key-fg: #eef1ee;
  --hl: #f3e6a6;
  --r-C: #6a716d; --r-B: #2a7f2a; --r-A: #8f6f00; --r-S: #0a7d86; --r-L: #a95f00; --r-SPECIAL: #9a2fa6; --r-OP: #bb2626; --r-HIDDEN: #6e1212;
  --f-display: "Black Han Sans", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-pixel: "Silkscreen", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141718; --surface: #1d2122; --sunk: #111415; --fg: #e5e9e6; --muted: #98a19c; --line: #2d3435;
  --accent: #8cc3d1; --key-bg: #3a4243; --key-fg: #f2f5f2; --hl: #4a4420;
  --r-C: #e6e6e6; --r-B: #55ff55; --r-A: #ffff55; --r-S: #55ffff; --r-L: #ffaa00; --r-SPECIAL: #ff55ff; --r-OP: #ff5555; --r-HIDDEN: #c43a3a;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141718; --surface: #1d2122; --sunk: #111415; --fg: #e5e9e6; --muted: #98a19c; --line: #2d3435;
  --accent: #8cc3d1; --key-bg: #3a4243; --key-fg: #f2f5f2; --hl: #4a4420;
  --r-C: #e6e6e6; --r-B: #55ff55; --r-A: #ffff55; --r-S: #55ffff; --r-L: #ffaa00; --r-SPECIAL: #ff55ff; --r-OP: #ff5555; --r-HIDDEN: #c43a3a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { padding-block: 40px 20px; }
.eyebrow { font-family: var(--f-pixel); font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(34px, 6vw, 56px); line-height: 1.1; margin: 8px 0 12px; text-wrap: balance; }
.lede { color: var(--muted); max-width: 62ch; margin: 0; }
.links { margin: 0 0 10px; }
.links a { color: var(--accent); font-weight: 600; text-decoration: none; border-bottom: 1px solid currentColor; }
.lede b { color: var(--fg); font-weight: 600; }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar .wrap { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px; }
.search { flex: 1 1 260px; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 12px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--fg); font: inherit; padding: 10px 0; outline: none; }
.search svg { flex: none; color: var(--muted); }
select#sp { font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; }
.chip { font: inherit; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
.chip .sq { width: 10px; height: 10px; background: var(--c); box-shadow: inset -2px -2px 0 rgb(0 0 0 / .25); }
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { border-color: var(--c, var(--fg)); background: color-mix(in srgb, var(--c, var(--fg)) 14%, var(--surface)); }
.chip:focus-visible, select:focus-visible, .copy:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.count { font-size: 13px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }

main { padding-block: 24px 64px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 16px; min-width: 0; scroll-margin-top: 140px; position: relative; }
.card.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { box-shadow: 0 0 0 3px var(--c); } 100% { box-shadow: 0 0 0 0 transparent; } }
.head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rank { font-family: var(--f-pixel); font-weight: 700; font-size: 12px; letter-spacing: .06em; color: var(--c); border: 2px solid var(--c); padding: 1px 6px 0; line-height: 1.5; }
.card h2 { font-family: var(--f-display); font-weight: 400; font-size: 24px; line-height: 1.2; margin: 0; }
.sp { font-size: 12px; color: var(--muted); background: var(--sunk); border-radius: 4px; padding: 2px 8px; }
.copy { margin-left: auto; font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid transparent; border-radius: 4px; padding: 3px 8px; cursor: pointer; }
.copy:hover { border-color: var(--line); color: var(--fg); }
.tag { margin: 6px 0 12px; color: var(--muted); font-style: italic; }
.skills { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
.sk { min-width: 0; }
.sk .line { margin: 0; }
.key { display: inline-block; font-size: 12px; font-weight: 600; background: var(--key-bg); color: var(--key-fg); border-radius: 4px; padding: 1px 7px; margin-right: 6px; box-shadow: inset 0 -2px 0 rgb(0 0 0 / .35); vertical-align: 1px; white-space: nowrap; }
.key.weak { background: color-mix(in srgb, var(--r-OP) 75%, var(--key-bg)); }
.key.pas { background: color-mix(in srgb, var(--accent) 55%, var(--key-bg)); }
.sk .nm { font-weight: 700; }
.sub { list-style: none; margin: 4px 0 0; padding: 0 0 0 14px; border-left: 2px solid var(--line); display: grid; gap: 2px; color: var(--muted); font-size: 14px; }
.sub li { color: var(--fg); opacity: .86; }
.note { font-size: 13px; color: var(--muted); margin: 0 0 10px; }
mark { background: var(--hl); color: inherit; border-radius: 2px; }
.empty { text-align: center; color: var(--muted); padding: 48px 0; }

.locked { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 28px; }
.locked h3 { font-family: var(--f-display); font-weight: 400; font-size: 22px; margin: 0 0 4px; }
.locked p { margin: 0 0 16px; color: var(--muted); }
.lgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.lock { aspect-ratio: 1; max-width: 100%; background: var(--sunk); border: 2px dashed var(--line); border-radius: 6px; display: grid; place-items: center; font-family: var(--f-pixel); font-size: 22px; color: var(--r-HIDDEN); }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
@media (prefers-reduced-motion: reduce) { .card.flash { animation: none; } }
@media (max-width: 520px) { .card { padding: 16px; } .card h2 { font-size: 21px; } .count { width: 100%; margin-left: 0; } }
</style>

</head>
<body>
<header class="top"><div class="wrap">
  <div class="eyebrow">BattleZone · Paper 1.21.4 · v4.8</div>
  <h1>BattleZone 능력 도감</h1>
  <p class="links"><a href="patch.html">📜 최신 패치노트 보기</a></p>
  <p class="lede">게임이 시작되면 모두 무작위 능력 하나를 받아요. <b>철괴를 들고 우클릭·좌클릭</b>하면 능력이 나가고, 게임 안에서는 <b>/능력</b>으로 내 능력을 다시 볼 수 있어요.</p>
</div></header>

<div class="bar"><div class="wrap">
  <label class="search" for="q">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="2"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="q" type="search" placeholder="능력 이름이나 스킬 검색 (예: 고정 피해, 돌진)" autocomplete="off">
  </label>
  <select id="sp" aria-label="종족"></select>
  <div class="chips" id="chips" role="group" aria-label="등급"></div>
  <span class="count" id="count"></span>
</div></div>

<main><div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>검색 결과가 없어요. 다른 단어로 찾아보세요.</div>
  <section class="locked">
    <h3>히든 능력</h3>
    <p id="hiddenText"></p>
    <div class="lgrid" id="lgrid"></div>
  </section>
</div></main>
<footer><div class="wrap">능력 설명은 플러그인 안의 설명을 그대로 옮겼어요. 수치는 패치에 따라 바뀔 수 있어요.</div></footer>

let active = new Set(), query = "", species = "";

const counts = {}; DATA.list.forEach(a => counts[a.rank] = (counts[a.rank] || 0) + 1);
$("#chips").innerHTML = RANKS.filter(([k]) => counts[k]).map(([k, l]) =>
  `<button class="chip" type="button" id="r-${k}" data-r="${k}" aria-pressed="false" style="--c:var(--r-${k})"><span class="sq"></span>${l}<span class="n">${counts[k]}</span></button>`).join("");
const sps = [...new Set(DATA.list.map(a => a.sp))].sort((a, b) => a.localeCompare(b, "ko"));
$("#sp").innerHTML = `<option value="">모든 종족</option>` + sps.map(s => `<option>${esc(s)}</option>`).join("");

function hl(text) {
  const t = esc(text);
  if (!query) return t;
  const q = esc(query).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return t.replace(new RegExp(q, "gi"), m => `<mark>${m}</mark>`);
}
function keyClass(t) { return t.startsWith("약점") ? "key weak" : t.startsWith("패시브") ? "key pas" : "key"; }
function card(a) {
  const sk = a.skills.map(s => `<li class="sk"><p class="line">${s.t ? `<span class="${keyClass(s.t)}">${esc(s.t)}</span>` : ""}${s.n ? `<span class="nm">${hl(s.n)}</span> ` : ""}${hl(s.d)}</p>${s.sub.length ? `<ul class="sub">${s.sub.map(x => `<li>${hl(x)}</li>`).join("")}</ul>` : ""}</li>`).join("");
  const notes = a.notes.map(n => `<p class="note">${hl(n)}</p>`).join("");
  return `<article class="card" id="${a.id}" style="--c:var(--r-${a.rank})">
    <div class="head"><span class="rank">${a.rank}</span><h2>${hl(a.name)}</h2><span class="sp">${esc(a.sp)}</span></div>
    <p class="tag">“${hl(a.tag)}”</p>${notes}<ul class="skills">${sk}</ul></article>`;
}
function text(a) { return [a.name, a.tag, ...a.notes, ...a.skills.flatMap(s => [s.t, s.n, s.d, ...s.sub])].join(" ").toLowerCase(); }
DATA.list.forEach(a => a._t = text(a));

function render() {
  const q = query.toLowerCase();
  const shown = DATA.list.filter(a => (!active.size || active.has(a.rank)) && (!species || a.sp === species) && (!q || a._t.includes(q)));
  $("#grid").innerHTML = shown.map(card).join("");
  $("#empty").hidden = shown.length > 0;
  $("#count").textContent = `${shown.length} / ${DATA.list.length}개`;
}
$("#chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  const r = b.dataset.r;
  active.has(r) ? active.delete(r) : active.add(r);
  b.setAttribute("aria-pressed", active.has(r));
  render();
});
$("#q").addEventListener("input", e => { query = e.target.value.trim(); render(); });
$("#sp").addEventListener("change", e => { species = e.target.value; render(); });
$("#hiddenText").textContent = `${DATA.hidden}개의 능력이 숨겨져 있어요. 어떤 능력인지, 어떻게 얻는지는 비밀이에요. 조건을 만족하면 게임 안에서 나타나요.`;
$("#lgrid").innerHTML = Array.from({length: DATA.hidden}, () => `<div class="lock" aria-label="숨겨진 능력">???</div>`).join("");

render();
function jump() {
  const id = location.hash.slice(1); if (!id) return;
  const el = document.getElementById(id);
  if (el && el.classList.contains("card")) { el.scrollIntoView({block: "start"}); el.classList.add("flash"); }
}
jump(); window.addEventListener("hashchange", jump);
</script>

</body>
</html>
